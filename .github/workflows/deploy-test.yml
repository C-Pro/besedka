name: Manual Deploy - Test Instance (Spot R2-Only)

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for deployment'
        required: false
        default: 'Manual test deployment'

env:
  GCP_REGION: 'asia-southeast2'
  GCP_ZONE: 'asia-southeast2-a'
  AR_REPO: 'besedka'
  TEST_MIG_NAME: 'besedka-test-mig'

jobs:
  deploy-test:
    name: Build & Deploy Test Instance to GCP Spot VM
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Log in to GCP Artifact Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GCP_REGION }}-docker.pkg.dev
          username: _json_key
          password: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.GCP_REGION }}-docker.pkg.dev/${{ secrets.GCP_PROJECT }}/${{ env.AR_REPO }}/app
          tags: |
            type=raw,value=test
            type=sha,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64

      - name: Trigger Rolling Replace on Test Managed Instance Group
        run: |
          gcloud compute instance-groups managed rolling-action replace ${{ env.TEST_MIG_NAME }} \
            --zone=${{ env.GCP_ZONE }} \
            --project=${{ secrets.GCP_PROJECT }}
